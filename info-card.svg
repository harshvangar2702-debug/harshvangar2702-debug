<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 370" width="490" height="370">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .title-bar { fill: #161b22; rx: 10px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; font-weight: bold; }
    
    .user-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #58a6ff; font-weight: bold; }
    .key-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #ffa657; font-weight: bold; }
    .val-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .sep-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
    .hl-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 500; }

    .card-line {
      opacity: 0;
      transform: translateY(6px);
      animation: fadeInSlide 0.35s ease-out forwards;
    }

    @keyframes fadeInSlide {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <!-- Container Box -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Terminal Title Bar -->
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 480,0 A 10,10 0 0,1 490,10 L 490,32 L 0,32 Z" class="title-bar" />
  <circle cx="18" cy="16" r="4.5" class="dot-red" />
  <circle cx="32" cy="16" r="4.5" class="dot-yellow" />
  <circle cx="46" cy="16" r="4.5" class="dot-green" />
  <text x="245.0" y="20" text-anchor="middle" class="title-text">harshvangar2702-debug@github: ~$ neofetch</text>

  <!-- Lines -->
  
    <g class="card-line" style="animation-delay: 0.08s;">
      <text x="25" y="62" class="user-text">harshvangar2702-debug</text>
    </g>
    <g class="card-line" style="animation-delay: 0.14s;">
      <text x="25" y="86" class="key-text">Now</text>
      <text x="115" y="86" class="val-text" fill="#79c0ff">Frontend & UI Specialist</text>
    </g>
    <g class="card-line" style="animation-delay: 0.2s;">
      <text x="25" y="110" class="key-text">Prev</text>
      <text x="115" y="110" class="val-text" fill="#79c0ff">Web Application Engineer</text>
    </g>
    <g class="card-line" style="animation-delay: 0.26s;">
      <text x="25" y="134" class="key-text">Edu</text>
      <text x="115" y="134" class="val-text" fill="#79c0ff">B.Tech in Computer Science</text>
    </g>
    <g class="card-line" style="animation-delay: 0.32s;">
      <text x="25" y="158" class="sep-text">-- Stack</text>
    </g>
    <g class="card-line" style="animation-delay: 0.38s;">
      <text x="25" y="178" class="key-text">Frontend</text>
      <text x="115" y="178" class="val-text" fill="#ffa657">React, Next.js, TypeScript, Tailwind, CSS3</text>
    </g>
    <g class="card-line" style="animation-delay: 0.44s;">
      <text x="25" y="202" class="key-text">Backend</text>
      <text x="115" y="202" class="val-text" fill="#a5d6ff">Node.js, Express, Python, REST APIs</text>
    </g>
    <g class="card-line" style="animation-delay: 0.5s;">
      <text x="25" y="226" class="key-text">AI / ML</text>
      <text x="115" y="226" class="val-text" fill="#d2a8ff">LangChain, OpenAI API, Vercel AI SDK</text>
    </g>
    <g class="card-line" style="animation-delay: 0.56s;">
      <text x="25" y="250" class="key-text">Cloud</text>
      <text x="115" y="250" class="val-text" fill="#ff7b72">Vercel, Docker, Git, GitHub Actions</text>
    </g>
    <g class="card-line" style="animation-delay: 0.62s;">
      <text x="25" y="274" class="sep-text">-- Highlights</text>
    </g>
    <g class="card-line" style="animation-delay: 0.68s;">
      <text x="25" y="294" class="hl-text" fill="#56d364">• Crafting pixel-perfect, responsive UI design systems</text>
    </g>
    <g class="card-line" style="animation-delay: 0.74s;">
      <text x="25" y="316" class="hl-text" fill="#56d364">• Building interactive animated web components & SVGs</text>
    </g>
</svg>
