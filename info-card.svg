<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 370" width="490" height="370">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .title-bar { fill: #161b22; rx: 10px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
    
    .key-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #58a6ff; font-weight: bold; }
    .val-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; }

    .card-line {
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInSlide 0.4s ease-out forwards;
    }

    @keyframes fadeInSlide {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <!-- Container Box -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Terminal Title Bar -->
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 480,0 A 10,10 0 0,1 490,10 L 490,36 L 0,36 Z" class="title-bar" />
  <circle cx="20" cy="18" r="5.5" class="dot-red" />
  <circle cx="36" cy="18" r="5.5" class="dot-yellow" />
  <circle cx="52" cy="18" r="5.5" class="dot-green" />
  <text x="245.0" y="22" text-anchor="middle" class="title-text">harshvangar2702-debug@github: ~ (neofetch)</text>

  <!-- Info Key-Value Rows -->
  
    <g class="card-line" style="animation-delay: 0.1s;">
      <text x="30" y="75" class="key-text">OS:</text>
      <text x="130" y="75" class="val-text" fill="#79c0ff">Arch Linux x86_64 / macOS</text>
    </g>
    <g class="card-line" style="animation-delay: 0.18s;">
      <text x="30" y="101" class="key-text">Host:</text>
      <text x="130" y="101" class="val-text" fill="#79c0ff">GitHub Profile Terminal v2.4</text>
    </g>
    <g class="card-line" style="animation-delay: 0.26s;">
      <text x="30" y="127" class="key-text">Uptime:</text>
      <text x="130" y="127" class="val-text" fill="#79c0ff">99.98% (Continuous Integration)</text>
    </g>
    <g class="card-line" style="animation-delay: 0.34s;">
      <text x="30" y="153" class="key-text">Shell:</text>
      <text x="130" y="153" class="val-text" fill="#79c0ff">zsh 5.9 (x86_64-apple-darwin22.0)</text>
    </g>
    <g class="card-line" style="animation-delay: 0.42s;">
      <text x="30" y="179" class="key-text">Role:</text>
      <text x="130" y="179" class="val-text" fill="#ffa657">Senior Full-Stack Engineer & Architect</text>
    </g>
    <g class="card-line" style="animation-delay: 0.5s;">
      <text x="30" y="205" class="key-text">Now:</text>
      <text x="130" y="205" class="val-text" fill="#a5d6ff">Building animated SVG profile tools</text>
    </g>
    <g class="card-line" style="animation-delay: 0.58s;">
      <text x="30" y="231" class="key-text">Prev:</text>
      <text x="130" y="231" class="val-text" fill="#a5d6ff">Distributed Systems Lead @ TechCorp</text>
    </g>
    <g class="card-line" style="animation-delay: 0.66s;">
      <text x="30" y="257" class="key-text">Stack:</text>
      <text x="130" y="257" class="val-text" fill="#d2a8ff">Python, TypeScript, React, Go, Docker, K8s</text>
    </g>
    <g class="card-line" style="animation-delay: 0.74s;">
      <text x="30" y="283" class="key-text">Focus:</text>
      <text x="130" y="283" class="val-text" fill="#ff7b72">Web Performance, CLI Tools, Open Source</text>
    </g>
    <g class="card-line" style="animation-delay: 0.82s;">
      <text x="30" y="309" class="key-text">Highlights:</text>
      <text x="130" y="309" class="val-text" fill="#56d364">9.3k+ Yearly Commits, 50+ PRs Merged</text>
    </g>

  <!-- Bottom Color Blocks -->
  
    <rect x="30" y="347" width="22" height="12" rx="3" fill="#ff7b72" class="card-line" style="animation-delay: 0.9s;" />
    <rect x="58" y="347" width="22" height="12" rx="3" fill="#ffa657" class="card-line" style="animation-delay: 0.98s;" />
    <rect x="86" y="347" width="22" height="12" rx="3" fill="#d2a8ff" class="card-line" style="animation-delay: 1.06s;" />
    <rect x="114" y="347" width="22" height="12" rx="3" fill="#79c0ff" class="card-line" style="animation-delay: 1.14s;" />
    <rect x="142" y="347" width="22" height="12" rx="3" fill="#56d364" class="card-line" style="animation-delay: 1.22s;" />
    <rect x="170" y="347" width="22" height="12" rx="3" fill="#e3b341" class="card-line" style="animation-delay: 1.3s;" />
</svg>
