name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # Runs at ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch live contributions
        run: |
          # Replace username with your GitHub handle if needed
          python scripts/fetch_contributions.py --username ${{ github.repository_owner }}

      - name: Render heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
